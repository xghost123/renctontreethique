<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0f3a7d" opacity="0.1"/>
  
  <!-- Main design: Two hearts forming a mosque dome -->
  <g>
    <!-- Left heart (woman) -->
    <path d="M 70 65 C 70 55 60 45 50 45 C 40 45 30 55 30 65 C 30 75 70 110 70 110 L 70 65 Z" fill="#ff6b6b" opacity="0.9"/>
    
    <!-- Right heart (man) -->
    <path d="M 130 65 C 130 55 140 45 150 45 C 160 45 170 55 170 65 C 170 75 130 110 130 110 L 130 65 Z" fill="#0f3a7d" opacity="0.9"/>
    
    <!-- Center: Mosque dome -->
    <ellipse cx="100" cy="90" rx="28" ry="35" fill="#17a2b8" opacity="0.85"/>
    
    <!-- Dome curve -->
    <path d="M 72 90 Q 72 55 100 45 Q 128 55 128 90" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    
    <!-- Crescent moon at top of dome -->
    <g transform="translate(100, 35)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#ff6b6b" stroke-width="2"/>
      <path d="M -2 0 Q 0 -2 2 0" fill="#ff6b6b"/>
    </g>
    
    <!-- Ring below -->
    <circle cx="100" cy="125" r="45" fill="none" stroke="#0f3a7d" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Text: Rencontre Éthique -->
  <text x="100" y="160" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" text-anchor="middle" fill="#0f3a7d" letter-spacing="1">
    RENCONTRE ÉTHIQUE
  </text>
  
  <!-- Tagline -->
  <text x="100" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle" fill="#17a2b8" letter-spacing="0.5">
    Halal Marriage Platform
  </text>
</svg>
